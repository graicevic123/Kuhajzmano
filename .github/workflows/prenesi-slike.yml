name: Prenesi slike
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  slike:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow requests
      - run: python tools/prenesi_slike.py
      - name: Shrani spremembe
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Slike prenesene z Bloggerja" || echo "Ni sprememb"
          git push
